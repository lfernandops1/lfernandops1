<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Fernando Santos — Software Developer</title>
  <desc id="description">Banner profissional em tons de azul e verde para o perfil de Fernando Santos.</desc>

  <defs>
    <linearGradient id="background" x1="60" y1="20" x2="1120" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.52" stop-color="#0B1F33"/>
      <stop offset="1" stop-color="#063B3A"/>
    </linearGradient>
    <linearGradient id="accent" x1="232" y1="86" x2="967" y2="227" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1030 46) rotate(135) scale(340 230)">
      <stop stop-color="#2DD4BF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#94A3B8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="24" fill="url(#glow)"/>

  <circle cx="1084" cy="70" r="146" stroke="#5EEAD4" stroke-opacity="0.11" stroke-width="30"/>
  <circle cx="1084" cy="70" r="89" stroke="#38BDF8" stroke-opacity="0.14" stroke-width="2"/>
  <path d="M65 237H1135" stroke="url(#accent)" stroke-opacity="0.34"/>
  <path d="M64 242H480" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)" opacity="0.45"/>

  <rect x="64" y="50" width="214" height="30" rx="15" fill="#0F2A42" stroke="#38BDF8" stroke-opacity="0.45"/>
  <text x="171" y="70" text-anchor="middle" fill="#BAE6FD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2">SOFTWARE DEVELOPER</text>

  <text x="64" y="143" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5">Fernando Santos</text>
  <text x="67" y="187" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" letter-spacing="0.5">APIs robustas, segurança e produtos digitais</text>

  <text x="66" y="267" fill="#7DD3FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.1">JAVA 17</text>
  <circle cx="157" cy="262" r="2.5" fill="#2DD4BF"/>
  <text x="174" y="267" fill="#99F6E4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.1">SPRING BOOT</text>
  <circle cx="309" cy="262" r="2.5" fill="#38BDF8"/>
  <text x="326" y="267" fill="#7DD3FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.1">POSTGRESQL</text>
  <circle cx="453" cy="262" r="2.5" fill="#2DD4BF"/>
  <text x="470" y="267" fill="#99F6E4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.1">DOCKER</text>
</svg>
